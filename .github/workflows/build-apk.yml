name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36 & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "Available android-36 packages:"
          "$SDKMANAGER" --list --channel=0 | grep -E "android-36|build-tools;36" || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --install "platforms;android-36.1" || "$SDKMANAGER" --channel=1 --install "platforms;android-36.1" || true
          echo "Installed platforms:"
          ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            ls -la debug.keystore
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --no-build-cache --console=plain 2>&1 | tee gradle-build.log

      - name: Report Build Error Details
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            echo "### Gradle Failure Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 gradle-build.log | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ERR_MSG=$(grep -A 5 "What went wrong:" gradle-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            if [ -n "$ERR_MSG" ]; then
              echo "::error::$ERR_MSG"
            else
              LAST_ERR=$(tail -n 12 gradle-build.log | tr '\n' ' ')
              echo "::error::$LAST_ERR"
            fi
          fi

      - name: Package APK and ZIP
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CornerSense-Lab.apk
          zip -j dist/CornerSense-Lab-APK.zip dist/CornerSense-Lab.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CornerSense-Lab-APK
          path: dist/CornerSense-Lab.apk

      - name: Publish to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CornerSense Lab (Latest APK)
          draft: false
          prerelease: false
          files: |
            dist/CornerSense-Lab.apk
            dist/CornerSense-Lab-APK.zip
